name: spec-check

on:
  push:
    paths:
      - "docs/**"
      - "tools/spec-check.py"
      - ".github/workflows/spec-check.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tools/spec-check.py"
      - ".github/workflows/spec-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify the PW-1x documents
        run: python3 tools/spec-check.py
